name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  source-security:
    name: Repository security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full 3D plugin history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan full history for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Validate scanner exceptions
        run: scripts/check-security-exceptions

  package:
    name: Artifact on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: source-security
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout 3D plugin
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Build and test installed wheel
        run: |
          uv build --wheel --out-dir dist server
          uvx twine check dist/*.whl
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv venv "${{ runner.temp }}/artifact-test"
          uv pip install --python "${{ runner.temp }}/artifact-test/bin/python" \
            --index-url https://pypi.org/simple \
            "$wheel" "pytest>=8"
          "${{ runner.temp }}/artifact-test/bin/python" -c \
            'from importlib.metadata import entry_points, metadata; requirements = metadata("bunnyland-3d").get_all("Requires-Dist", []); assert any(item.startswith("bunnyland[server]") and "<2" in item for item in requirements); assert any(item.startswith("relics-ecs") and "<0.2" in item for item in requirements); entry, = [item for item in entry_points(group="bunnyland.plugins") if item.name == "bunnyland.3d"]; assert entry.load()()'
          "${{ runner.temp }}/artifact-test/bin/python" -m pytest server/tests
          uvx ruff check server/src server/tests

  server:
    name: Server Plugin
    runs-on: ubuntu-latest
    needs: package
    outputs:
      base-digest: ${{ steps.server-base.outputs.digest }}
      base-sha: ${{ steps.server-base.outputs.sha }}
      digest: ${{ steps.server-build.outputs.digest }}
    steps:
      - name: Checkout 3D plugin
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable server base
        id: server-base
        run: |
          image=$(sed -n 's/^ARG BUNNYLAND_SERVER_IMAGE=//p' Dockerfile.server)
          [[ "$image" =~ ^ghcr.io/thalismind/bunnyland-server@sha256:[0-9a-f]{64}$ ]]
          test "$(printf '%s\n' "$image" | wc -l)" -eq 1
          docker pull "$image"
          source_sha=$(docker image inspect "$image" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "digest=${image##*@}" >> "$GITHUB_OUTPUT"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Build server test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.server
          target: test
          pull: true
          push: false
          load: true
          tags: bunnyland-3d-server-test:ci
      - name: Run server tests
        run: |
          sudo install -d -o 10001 -g 10001 -m 0755 .reports
          docker run --rm -v "${PWD}/.reports:/reports" bunnyland-3d-server-test:ci
      - name: Upload server test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-reports
          path: .reports/*.xml
          if-no-files-found: warn
      - name: Summarize server test reports
        if: always()
        run: python3 scripts/junit-summary .reports
      - name: Build server image
        id: server-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.server
          target: runtime
          pull: true
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          tags: |
            ghcr.io/thalismind/bunnyland-3d-server:main
            ghcr.io/thalismind/bunnyland-3d-server:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Scan exact server image
        uses: anchore/scan-action@v7.4.0
        with:
          image: ghcr.io/thalismind/bunnyland-3d-server:${{ github.sha }}
          output-format: json
          output-file: bunnyland-3d-server.grype.json
          fail-build: false
          only-fixed: false
          severity-cutoff: high
          by-cve: true
          config: .grype.yaml
      - name: Fail on actionable server image findings
        run: scripts/check-grype-findings bunnyland-3d-server.grype.json

  web:
    name: Web Client
    runs-on: ubuntu-latest
    needs: package
    outputs:
      base-digest: ${{ steps.web-base.outputs.digest }}
      base-sha: ${{ steps.web-base.outputs.sha }}
      digest: ${{ steps.web-build.outputs.digest }}
    steps:
      - name: Checkout 3D plugin
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable web base
        id: web-base
        run: |
          image=$(sed -n 's/^ARG BUNNYLAND_WEB_IMAGE=//p' Dockerfile.web)
          [[ "$image" =~ ^ghcr.io/thalismind/bunnyland-web@sha256:[0-9a-f]{64}$ ]]
          test "$(printf '%s\n' "$image" | wc -l)" -eq 1
          docker pull "$image"
          source_sha=$(docker image inspect "$image" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "digest=${image##*@}" >> "$GITHUB_OUTPUT"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Build web test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          target: test
          push: false
          load: true
          tags: bunnyland-3d-web-test:ci
      - name: Run web tests
        run: |
          mkdir -p .reports
          docker run --rm -v "${PWD}/.reports:/reports" bunnyland-3d-web-test:ci
      - name: Build browser smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          target: browser-test
          push: false
          load: true
          tags: bunnyland-3d-browser-test:ci
      - name: Run browser smoke
        run: |
          mkdir -p .reports/artifacts
          set +e
          docker run --rm --shm-size=1g -e BUNNYLAND_3D_ARTIFACT_DIR=/reports/artifacts -v "${PWD}/.reports:/reports" bunnyland-3d-browser-test:ci
          status=$?
          if [ "$status" -eq 0 ]; then
            printf '%s\n' '<testsuite name="browser-smoke" tests="1" failures="0" errors="0"><testcase classname="browser" name="playwright-world-3d"/></testsuite>' > .reports/browser-smoke.xml
          else
            printf '%s\n' '<testsuite name="browser-smoke" tests="1" failures="1" errors="0"><testcase classname="browser" name="playwright-world-3d"><failure message="browser smoke failed"/></testcase></testsuite>' > .reports/browser-smoke.xml
          fi
          exit "$status"
      - name: Upload web test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-test-reports
          path: .reports/*.xml
          if-no-files-found: warn
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-screenshots
          path: .reports/artifacts/*.png
          if-no-files-found: warn
      - name: Summarize web test reports
        if: always()
        run: python3 scripts/junit-summary .reports
      - name: Build web image
        id: web-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          target: runtime
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          tags: |
            ghcr.io/thalismind/bunnyland-3d-web:main
            ghcr.io/thalismind/bunnyland-3d-web:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Scan exact web image
        uses: anchore/scan-action@v7.4.0
        with:
          image: ghcr.io/thalismind/bunnyland-3d-web:${{ github.sha }}
          output-format: table
          fail-build: true
          only-fixed: true
          severity-cutoff: high
          by-cve: true

  dispatch-vps-promotion:
    name: Request sandbox pin promotion
    runs-on: ubuntu-latest
    needs:
      - server
      - web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Dispatch exact source and image hashes to VPS
        env:
          GH_TOKEN: ${{ secrets.BUNNYLAND_VPS_PROMOTION_TOKEN }}
          SERVER_BASE_DIGEST: ${{ needs.server.outputs.base-digest }}
          SERVER_BASE_SHA: ${{ needs.server.outputs.base-sha }}
          SERVER_DIGEST: ${{ needs.server.outputs.digest }}
          WEB_BASE_DIGEST: ${{ needs.web.outputs.base-digest }}
          WEB_BASE_SHA: ${{ needs.web.outputs.base-sha }}
          WEB_DIGEST: ${{ needs.web.outputs.digest }}
        run: |
          test -n "$GH_TOKEN"
          [[ "$SERVER_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WEB_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SERVER_BASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WEB_BASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SERVER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n \
            --arg source_ref "$GITHUB_REF" \
            --arg three_d_sha "$GITHUB_SHA" \
            --arg server_sha "$SERVER_BASE_SHA" \
            --arg server_base_digest "$SERVER_BASE_DIGEST" \
            --arg server_digest "$SERVER_DIGEST" \
            --arg web_sha "$WEB_BASE_SHA" \
            --arg web_base_digest "$WEB_BASE_DIGEST" \
            --arg web_digest "$WEB_DIGEST" \
            '{
              event_type: "promote-sandbox",
              client_payload: {
                source_ref: $source_ref,
                three_d_sha: $three_d_sha,
                server_sha: $server_sha,
                server_base_digest: $server_base_digest,
                server_digest: $server_digest,
                web_sha: $web_sha,
                web_base_digest: $web_base_digest,
                web_digest: $web_digest
              }
            }' |
            gh api --method POST repos/thalismind/bunnyland-vps/dispatches --input -
